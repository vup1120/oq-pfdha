name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # openquake.engine pins gdal/fiona versions whose Linux wheels are
          # published on GEM's wheelhouse, not on PyPI; install the engine's
          # pinned requirements first so pip never tries a source build.
          PY=$(python -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}")')
          pip install -r "https://raw.githubusercontent.com/gem/oq-engine/master/requirements-${PY}-linux64.txt"
          pip install -e .
          pip install pytest

      - name: Run test suite (unit, integration, benchmark; excluding slow)
        run: pytest -m "not slow"

      - name: Run quickstart example
        run: |
          mkdir -p examples/outputs
          fdha examples/hazard_curve_minimal.ini \
               --plot examples/outputs/hazard_curve_minimal.png
