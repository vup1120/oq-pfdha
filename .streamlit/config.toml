# Streamlit theme for the oq-pfdha web GUI (webgui_demo/app.py).
# Warm, earthy palette from the oq-pfdha design-system handoff. Typography
# is loaded in app.py because Streamlit theme config only supports built-ins.
[theme]
base = "light"
primaryColor = "#f2762b"
backgroundColor = "#faf8f3"
secondaryBackgroundColor = "#f3eee6"
textColor = "#352d24"

[browser]
gatherUsageStats = false
