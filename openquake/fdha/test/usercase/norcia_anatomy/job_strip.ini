displacement_measure_levels = {"FD": [0.0001, 0.001, 0.005, 0.01, 0.015, 0.03, 0.05, 0.075, 0.1, 0.15, 0.3, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0, 7.5, 10.0, 15.0, 20.0, 30.0]}
case = case3
near_far_threshold_km = 0.2
r_threshold_km = 0.1
fdha_logic_tree_file = fdha_logic_tree_anatomy.xml
source_model_logic_tree_file = source_model_logic_tree.xml
