# Visini et al. (2025) site decision tree (calc/decision_tree.py), NOT the
# IAEA scenario name. case1 = a Rank 1.5 structure beneath the site cannot
# be excluded -> combinations A + B + C. MS (Mount Serra) and SL (San
# Lorenzo) are pre-existing antithetic faults that ruptured in 2016, i.e.
# the sites sit ON Rank 1.5 structures, so case1 is the declared, evidence-
# based classification here. It does not need rank1p5_traces_file: that
# file is only a way to derive the case from geometry when it is not known.
# NB this key was inherited as "case3" from the IAEA benchmark INI, where
# "Case 3" is the exercise's own scenario label - a name collision that
# silently restricted the run to combination A.
case = case1
near_far_threshold_km = 0.2
r_threshold_km = 0.1
fdha_logic_tree_file = fdha_logic_tree_anatomy.xml
source_model_logic_tree_file = source_model_logic_tree.xml
