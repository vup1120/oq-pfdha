[general]
description = Le Teil principal - M11 (Moss-Ross 2011 AD x Moss 2013 stiff; qualitative)
calculation_mode = fdha_classical

[geometry]
sites = 4.6700 44.5310

[site_params]
; Stiff site (vs30 > 600): Moss et al. (2013) gives P_sr(M5.5, reverse) =
; 9.9%, reproducing the paper's stated "10% for Mw=5.5" and the expected
; plateau rate*P_sr = 4.6e-5 * 0.099 = 4.6e-6. (The soft-site branch,
; vs30 <= 600, raises P_sr to 15.6% -> plateau 7.2e-6, which overshoots
; the paper's own text; see le_teil/diagnose_M11_psr.py.)
reference_vs30_value = 760.0

[erf]
rupture_mesh_spacing = 0.2
width_of_mfd_bin = 0.1

[calculation]
investigation_time = 1.0
displacement_measure_levels = {"FD": [0.0001, 0.001, 0.005, 0.01, 0.015, 0.03, 0.05, 0.075, 0.1, 0.15, 0.3, 0.5, 0.75, 1.0, 3.0, 5.0, 7.5, 10.0]}
r_threshold_km = 0.3
fdha_logic_tree_file = flt_principal_M11.xml
source_model_logic_tree_file = smlt.xml
