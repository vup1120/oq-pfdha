[pytest]
# FDHA Test Suite - pytest Configuration
# =========================================

# Test discovery
testpaths = unit integration benchmark
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (full workflow)
    regression: marks tests that pin numerical output against a known baseline
    benchmark: marks tests as benchmark tests (comparisons with published results and source code)
    slow: marks tests as slow (deselect with '-m "not slow"')
    youngs2003: tests for Youngs et al. (2003) model
    petersen2011: tests for Petersen et al. (2011) model
    moss2024: tests for Moss et al. (2024) model
    kuehn2024: tests for Kuehn et al. (2024) model
    lavrentiadis2023: tests for Lavrentiadis & Abrahamson (2023) model
    chiou2025: tests for Chiou et al. (2025) model
    visini2025: tests for Visini et al. (2025) model

# Output options
# --import-mode=importlib avoids "import file mismatch" between benchmark scripts
# that share the basename run_test.py (no __init__.py / same-name modules).
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --import-mode=importlib

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Cache
cache_dir = .pytest_cache

# Parallel execution (requires pytest-xdist)
# Uncomment to enable parallel testing:
# addopts = -n auto


