; Runnable demo: single-site hazard-curve calculation with a strike-slip logic tree only.
; Contains no PLACEHOLDER_WEIGHT entries; used by CI tests and EGU demo.
; For the full (SS + NM) template see `job.ini` (which intentionally halts at FDLT-007).

[general]
description = Runnable demo: SS-only FDHA logic tree (single site, hazard curve)
calculation_mode = fdha_classical

[geometry]
sites = 16.16573727 39.64704451

[site_params]
reference_vs30_value = 760.0

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.1

[calculation]
source_model_logic_tree_file = source_model_logic_tree_SS_demo.xml
fdha_logic_tree_file = fdha_logic_tree_SS.xml
investigation_time = 1.0
displacement_measure_levels = {"FD": [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]}
