# Shared geometry block for the map-mode validation demo.
#
# This file is a REFERENCE - each scenario INI (single_bilinear_map/job.ini,
# single_elliptical_map/job.ini, blend_50_50_map/job.ini) must paste the
# [geometry] block below verbatim. Keeping the three INIs byte-identical in
# their [geometry] block is what lets verify_map.py compare per-site rates
# directly (same N_sites, same site ordering).
#
# The polygon covers the strike-slip trace in source_model_ss.xml
# (trace lons in 16.14-16.19, lats in 39.58-39.70). Spacing 0.05 deg yields
# a small coverage grid (approximately 4x4 active-grid sites; the exact count
# is recorded in manifest.json under grid.n_active_grid).

[geometry]
region = 16.10 39.55, 16.22 39.55, 16.22 39.72, 16.10 39.72
region_grid_spacing = 0.05
max_distance_km = 15.0
