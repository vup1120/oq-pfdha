; Logic Tree Validation demo - blend_50_50_map (map mode).
;
; Same logic tree as the sibling curve-mode run
;   (examples/logic_tree_validation/blend_50_50/fdha_logic_tree.xml)
; but evaluated over the same 4x4-ish grid as single_bilinear_map and
; single_elliptical_map. The [geometry] block MUST stay byte-identical
; across the three scenarios (see ../geometry_4x4.ini) so verify_map.py
; can check the per-site identity
;
;     lambda_blend(i, j) == 0.5 * lambda_A(i, j) + 0.5 * lambda_B(i, j)
;
; within 1e-12 on every active grid site and trace site.

[general]
description = LT validation demo - blend_50_50 (map mode)
calculation_mode = fdha_classical

; --- shared geometry block (keep in sync with ../geometry_4x4.ini) --------
[geometry]
region = 16.10 39.55, 16.22 39.55, 16.22 39.72, 16.10 39.72
region_grid_spacing = 0.05

[site_params]
reference_vs30_value = 760.0

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.1

[calculation]
source_model_logic_tree_file = ../../source_model_logic_tree.xml
fdha_logic_tree_file = ../../blend_50_50/fdha_logic_tree.xml
investigation_time = 1.0
displacement_measure_levels = {"FD": [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]}
return_period = 2475.0
r_threshold_km = 0.5
principal_distance_km = 2.0
max_distance_km = 15.0
