; Logic Tree Validation demo - single_bilinear (weight=1.0 on Petersen2011PrimaryFD_bilinear).
; All three runs in this folder share identical geometry, source model, ERF,
; site, and D0 grid. The ONLY difference is which fdha_logic_tree.xml is
; loaded. Keeping every other field identical is required so verify.py can
; do its aggregation-arithmetic check.

[general]
description = Logic tree validation run - single_bilinear
calculation_mode = fdha_classical

[geometry]
sites = 16.16878333 39.66247618

[site_params]
reference_vs30_value = 760.0

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.1

[calculation]
source_model_logic_tree_file = ../source_model_logic_tree.xml
fdha_logic_tree_file = fdha_logic_tree.xml
investigation_time = 1.0
displacement_measure_levels = {"FD": [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]}
