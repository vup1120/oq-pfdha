# Citation-traced metadata for FDHA Primary FD models.
#
# ONLY entries with a verifiable primary-source citation are included.
# Classes absent from this file are treated as UNKNOWN by validators
# (openquake/fdha/logic_tree/validators.py) and skipped without warning.
#
# Do NOT add entries without a primary source. Secondary FD and Surface
# Rupture Probability classes are intentionally excluded because no primary
# source is available in the same tabular form.

primary_fd_models:
  Youngs2003PrimaryFD:
    displacement_definition: D_p_V
    source: "Sarmiento et al. 2025, Table 1 (YEA03)"
  Petersen2011PrimaryFD:
    displacement_definition: D_p_L
    source: "Sarmiento et al. 2025, Table 1 (PEA11)"
  Chiou2025PrimaryFD:
    displacement_definition: D_sp_Nstar
    source: "Sarmiento et al. 2025, Table 1 (CEA25)"
