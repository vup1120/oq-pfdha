[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openquake.fdha"
dynamic = ["version"]
description = "Python tools for modelling probabilistic fault displacement hazard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Yen-Shin Chen", email = "ychen@ogs.it" },
]
maintainers = [
  { name = "Yen-Shin Chen", email = "ychen@ogs.it" },
]
keywords = ["seismic hazard", "fault displacement", "PFDHA", "OpenQuake"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cartopy>=0.22",
  "fiona>=1.9",
  "h3>=4",
  "matplotlib>=3.7",
  "numpy>=1.24,<2.3",
  "openquake.engine>=3.18",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "toml>=0.10",
  "tqdm>=4.64",
]

[project.urls]
Homepage = "https://github.com/vup1120/oq-pfdha"
Repository = "https://github.com/vup1120/oq-pfdha"

[project.scripts]
fdha = "openquake.fdha.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "openquake.fdha.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["openquake*"]
namespaces = true

[tool.setuptools.package-data]
"openquake.fdha.logic_tree" = ["*.yaml"]
"openquake.fdha.primary_surf_displ" = ["data/*.csv"]

[tool.pytest.ini_options]
# Mirrors openquake/fdha/test/pytest.ini so that running ``pytest`` from the
# repository root (rootdir = repo root, configfile = pyproject.toml) behaves the
# same as running from the test directory. ``importlib`` import mode avoids the
# "import file mismatch" collision between benchmark scripts that share the
# basename ``run_test.py`` (no __init__.py / same-name modules).
testpaths = [
    "openquake/fdha/test/unit",
    "openquake/fdha/test/integration",
    "openquake/fdha/test/benchmark",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers -ra --import-mode=importlib"
# ``openquake`` is a namespace package shared with the installed
# openquake.engine. Without this option, pytest's importlib mode registers a
# synthetic ``openquake`` parent module whose __path__ contains only this
# repository's portion, which breaks ``import openquake.commonlib`` during
# collection when running bare ``pytest`` from the repository root.
consider_namespace_packages = true
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (full workflow)",
    "regression: marks tests that pin numerical output against a known baseline",
    "benchmark: marks tests as benchmark tests (comparisons with published results and source code)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "youngs2003: tests for Youngs et al. (2003) model",
    "petersen2011: tests for Petersen et al. (2011) model",
    "moss2024: tests for Moss et al. (2024) model",
    "kuehn2024: tests for Kuehn et al. (2024) model",
    "lavrentiadis2023: tests for Lavrentiadis & Abrahamson (2023) model",
    "chiou2025: tests for Chiou et al. (2025) model",
    "visini2025: tests for Visini et al. (2025) model",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
