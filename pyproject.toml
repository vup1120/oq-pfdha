[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openquake.fdha"
dynamic = ["version"]
description = "Python tools for modelling probabilistic fault displacement hazard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Yen-Shin Chen", email = "ychen@ogs.it" },
]
maintainers = [
  { name = "Yen-Shin Chen", email = "ychen@ogs.it" },
]
keywords = ["seismic hazard", "fault displacement", "PFDHA", "OpenQuake"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "cartopy>=0.22",
  "fiona>=1.9",
  "h3>=4",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openquake.engine>=3.18",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "toml>=0.10",
  "tqdm>=4.64",
]

[project.urls]
Homepage = "https://github.com/vup1120/pfdha"
Repository = "https://github.com/vup1120/pfdha"

[project.scripts]
fdha = "openquake.fdha.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "openquake.fdha.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["openquake*"]
exclude = [
  "mock_h3*",
]
namespaces = true

[tool.setuptools.package-data]
"openquake.fdha.logic_tree" = ["*.yaml"]
"openquake.fdha.primary_surf_displ" = ["data/*.csv"]
